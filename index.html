<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d8ccb7" />
  <title>21天听力场景词汇</title>
  <link rel="stylesheet" href="./styles.css" />

</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <h1>21天听力场景词汇</h1>
        <div class="summary" id="summary">正在载入…</div>
      </div>

      <div class="search-row">
        <input id="search" class="search-box" type="search" autocomplete="off" placeholder="搜索英文、中文或场景…" aria-label="搜索词汇" />
        <div class="accent-switch" role="group" aria-label="发音口音">
          <button class="accent-btn" id="accent-us" type="button" data-accent="en-US">US</button>
          <button class="accent-btn" id="accent-uk" type="button" data-accent="en-GB">UK</button>
        </div>
      </div>

      <div class="toolbar" id="toolbar" aria-label="词表筛选"></div>
      <div class="audio-note">点单词或扬声器播放。真人词典录音优先；没有对应录音时，才使用设备的备用声线。</div>
    </header>

    <main id="main">
      <div class="loading">正在读取旧项目中的词表数据…</div>
    </main>
  </div>

  <nav class="pager" id="pager" aria-label="分页" hidden>
    <button id="prev-page" type="button" aria-label="上一页">←</button>
    <div class="page-status" id="page-status">1 / 1</div>
    <button id="next-page" type="button" aria-label="下一页">→</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./app.js" defer></script>

</body>
</html>
