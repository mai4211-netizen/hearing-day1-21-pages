<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#152033" />
  <title>21天场景词汇 · List</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./dictation.css" />
  <style>
    .row-meta { display: none; }
    .word-row { min-height: 68px; }
    .word-primary,
    .word-secondary { padding-top: 11px; padding-bottom: 11px; }

    @media (max-width: 760px) {
      .app-shell {
        width: min(calc(100% - 12px), 1180px);
        margin-top: 4px;
      }
      .app-header {
        top: 4px;
        padding: 10px 12px 9px;
        border-radius: 16px;
      }
      .topline { gap: 10px; min-height: 30px; }
      .brand { gap: 8px; }
      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        font-size: 13px;
        box-shadow: none;
      }
      .eyebrow { display: none; }
      h1 { font-size: 20px; line-height: 1.1; }
      .control-grid { margin-top: 8px; gap: 6px; }
      .search-control {
        height: 40px;
        border-radius: 11px;
      }
      .search-icon {
        padding-left: 12px;
        font-size: 19px;
      }
      .search-control input {
        padding-left: 8px;
        font-size: 14px;
      }
      .accent-switch {
        width: 88px;
        height: 40px;
        padding: 3px;
        border-radius: 11px;
      }
      .accent-btn { border-radius: 8px; font-size: 11px; }
      .toolbar {
        margin-top: 8px;
        gap: 6px;
        padding-bottom: 0;
      }
      .chip {
        min-height: 30px;
        padding: 0 10px;
        font-size: 11px;
      }
      .status-strip { display: none; }
      main { margin-top: 8px; }
      .word-primary { padding-bottom: 2px; }
      .word-secondary { padding-top: 2px; padding-bottom: 10px; }
    }

    @media (max-width: 430px) {
      .app-shell {
        width: calc(100% - 8px);
        margin-top: 2px;
      }
      .app-header {
        top: 2px;
        padding: 8px 10px;
        border-radius: 14px;
      }
      .brand-mark { display: none; }
      .brand { gap: 0; }
      h1 { font-size: 19px; }
      .control-grid { margin-top: 7px; }
      .search-control { height: 38px; }
      .accent-switch { width: 82px; height: 38px; }
      .toolbar { margin-top: 7px; }
      .chip { min-height: 29px; padding: 0 9px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="topline">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">21</span>
          <div>
            <div class="eyebrow">HEARING VOCABULARY · LIST</div>
            <h1>21天场景词汇</h1>
          </div>
        </div>
        <div class="summary" id="summary">正在载入…</div>
      </div>

      <div class="control-grid">
        <label class="search-control">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search" type="search" autocomplete="off" placeholder="搜索英文、中文、场景或 Day…" aria-label="搜索词汇" />
          <kbd>/</kbd>
        </label>

        <div class="accent-switch" role="group" aria-label="发音口音">
          <button class="accent-btn" id="accent-us" type="button" data-accent="en-US">US</button>
          <button class="accent-btn" id="accent-uk" type="button" data-accent="en-GB">UK</button>
        </div>
      </div>

      <div class="toolbar" id="toolbar" aria-label="词表筛选"></div>

      <div class="status-strip">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="voice-status">本地录音即时播放 · 设备声线备用</span>
        <span class="status-separator">·</span>
        <span>真人录音后台缓存，不阻塞点击</span>
      </div>
    </header>

    <main id="main" aria-live="polite">
      <div class="loading-state">
        <div class="loading-pulse"></div>
        <span>正在读取词表…</span>
      </div>
    </main>

    <nav class="pager" id="pager" aria-label="分页" hidden>
      <button id="prev-page" type="button" aria-label="上一页">← 上一页</button>
      <div class="page-status" id="page-status">1 / 1</div>
      <button id="next-page" type="button" aria-label="下一页">下一页 →</button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
  <script src="./audio.js" defer></script>
  <script src="./dictation.js" defer></script>
  <script src="./dictation-memory.js" defer></script>
  <script src="./dictation-autoplay.js" defer></script>
  <script src="./dictation-shortcuts.js" defer></script>
</body>
</html>
